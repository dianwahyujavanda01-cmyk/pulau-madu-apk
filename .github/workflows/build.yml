
name: Build Pulau Madu APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PulauMadu-Android-Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q PulauMadu-Android-Project.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p project/PulauMadu-Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pulau-Madu-APK
          path: project/PulauMadu-Android/app/build/outputs/apk/debug/app-debug.apk
